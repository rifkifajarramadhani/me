server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip text assets (parity with the old Caddy `encode gzip`)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 256;

    # Traefik/Docker healthcheck target
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    location = /admin {
        absolute_redirect off;
        return 308 /admin/;
    }

    location /admin/ {
        absolute_redirect off;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex" always;
        try_files $uri $uri/ =404;
    }

    # Astro is built with trailingSlash: 'always' → directory-style pages.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
