name: setup-bun
description: "Setup Bun - Cache dependencies - Install dependencies"
runs:
  using: "composite"
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.4

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
