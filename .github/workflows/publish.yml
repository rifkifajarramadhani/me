name: deploy-me
on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: "deploy-me"
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/rifkifajarramadhani/me
  CMS_IMAGE: ghcr.io/rifkifajarramadhani/me-cms
  PUBLISHING_PROFILE: apex

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun - Install dependencies
        uses: ./.github/workflows/setup-bun

      - name: Check code and both publishing profiles
        run: bun run check

      - name: Build both apps
        run: bun run build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          build-args: |
            PUBLISHING_PROFILE=${{ env.PUBLISHING_PROFILE }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Build and push CMS image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ env.CMS_IMAGE }}:latest
            ${{ env.CMS_IMAGE }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Prepare CMS Compose configuration
        run: |
          compose_b64=$(base64 -w 0 docker-compose.yml)
          printf 'ME_COMPOSE_B64=%s\n' "$compose_b64" >> "$GITHUB_ENV"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          ME_IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: ME_IMAGE_TAG,ME_COMPOSE_B64
          script: |
            set -eu
            "$HOME/deploy-me.sh" "$ME_IMAGE_TAG"
            cms_env="$HOME/.config/me-cms/.env"
            if [ -r "$cms_env" ]; then
              export IMAGE_TAG="$ME_IMAGE_TAG"
              deploy_cms() {
                printf '%s' "$ME_COMPOSE_B64" | base64 -d |
                  docker compose --project-name me-cms --env-file "$cms_env" --profile cms -f - "$@"
              }
              deploy_cms pull cms
              deploy_cms up -d --no-deps --no-build --wait cms
            fi
