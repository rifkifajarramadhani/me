name: deploy-me
on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: "deploy-me"
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/rifkifajarramadhani/me
  PUBLISHING_PROFILE: apex

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun - Install dependencies
        uses: ./.github/workflows/setup-bun

      - name: Check code and both publishing profiles
        run: bun run check

      - name: Build apex artifact
        run: bun run build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            PUBLISHING_PROFILE=${{ env.PUBLISHING_PROFILE }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: ~/deploy-me.sh ${{ github.sha }}
